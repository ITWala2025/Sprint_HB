:root[data-theme="dark"]{--bg:#0b1220;--card:#111a2e;--line:#334155;--ph:#1e293b;--tx:#e2e8f0;--mu:#94a3b8;--navy:#e2e8f0;--warn:#3b1219;--ok:#0f2742}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:16px;max-width:1100px;margin:auto}
h1{font-size:20px;margin:0 0 4px}header p{margin:0;color:var(--mu);font-size:13px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;align-items:center}

.bar button.on{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.sp{flex:1}
main{max-width:1100px;margin:auto;padding:0 16px 40px}
.frame{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0 auto;transition:max-width .2s;max-width:100%}
.frame.m{max-width:390px}
section{display:none}section.on{display:block}
.note{font-size:12px;color:var(--mu);margin:10px 0}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--warn);color:var(--red);border:1px solid var(--red);vertical-align:middle}
.tag.ok{background:var(--ok);color:#0b63b6;border-color:#0b63b6}
.nav{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line)}
.logo{font-weight:800;color:var(--red);letter-spacing:.04em}
.nav .l{display:flex;gap:12px;color:var(--mu);flex:1;justify-content:center}
.m .nav .l{display:none}.m .nav{justify-content:space-between}
.tick{background:var(--navy);color:var(--bg);font-size:12px;padding:8px 16px;white-space:nowrap;overflow:hidden}
.foot{border-top:1px solid var(--line);padding:14px 16px;color:var(--mu);font-size:12px;display:flex;gap:16px;flex-wrap:wrap}
.pad{padding:18px 16px}
.btn{display:inline-block;border:1.5px solid var(--navy);padding:7px 14px;border-radius:9px;font-weight:600;font-size:12.5px}
.btn.r{background:var(--red);border-color:var(--red);color:#fff}
.ph{background:var(--ph);border-radius:8px;min-height:44px;display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:12px;text-align:center;padding:6px}
.hero{background:var(--ph);padding:34px 16px;border-bottom:1px solid var(--line)}
.hero h2{font-size:26px;margin:0 0 6px}
.box{border:1.5px dashed var(--line);border-radius:10px;padding:12px;background:var(--card)}
.g2,.g3,.g4{display:grid;gap:10px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.m .g2,.m .g3,.m .g4{grid-template-columns:1fr}.m .g4.keep{grid-template-columns:1fr 1fr}
.side{display:grid;grid-template-columns:230px 1fr;gap:14px}.m .side{grid-template-columns:1fr}
.sb{border-right:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.m .sb{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap}
.sb span{padding:7px 10px;border-radius:8px;font-size:12.5px}.sb .a{background:var(--navy);color:var(--bg)}
h3{margin:0 0 8px;font-size:15px}
.fld{border:1.5px solid var(--line);border-radius:8px;padding:9px;color:var(--mu);font-size:12px;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:12.5px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.sc{overflow-x:auto}
.mb{margin-bottom:12px}
.au{display:grid;grid-template-columns:42% 58%;min-height:480px}.m .au{grid-template-columns:1fr}.m .au>.ph{display:none}.gl{font-size:11px;font-weight:700;color:var(--mu);text-transform:uppercase;margin:0 2px 0 8px}.bar{max-height:none}
